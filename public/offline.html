<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>You are offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 28rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; opacity: .8; }
    button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 1.25rem; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>This page has not been saved on your device. Pages you have already opened are still available. Shipment status and other live information need a connection.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
